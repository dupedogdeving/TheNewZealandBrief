/* ============================================================
   1. RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: inherit; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
ul { list-style: none; margin: 0; padding: 0; }

/* ============================================================
   2. TOKENS
   ============================================================ */
:root {
  --paper: #F5F4EF;
  --paper-dim: #EAE7DE;
  --ink: #14181C;
  --ink-soft: #57626C;
  --navy: #0B1F2A;
  --navy-soft: #17323F;
  --navy-soft-2: #1F3F4F;
  --jade: #1C6B57;
  --jade-dark: #124E3F;
  --kowhai: #E8A33D;
  --kowhai-dark: #C6842A;
  --white: #FFFFFF;
  --line: rgba(20,24,28,0.12);
  --line-navy: rgba(255,255,255,0.16);
  --danger: #B3432D;
  --radius: 12px;
  --radius-sm: 7px;
  --shadow: 0 10px 28px rgba(11,31,42,0.10);
  --shadow-lg: 0 20px 48px rgba(11,31,42,0.22);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
}

.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ============================================================
   3. HEADER / MASTHEAD
   ============================================================ */
.masthead { background: var(--navy); color: var(--white); position: sticky; top: 0; z-index: 40; }
.masthead-top {
  max-width: 1180px; margin: 0 auto; padding: 18px 24px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 0; color: inherit; text-align: left; }
.brand:hover .fern-mark { color: var(--kowhai); }
.fern-mark { color: var(--white); transition: color .3s ease; flex-shrink: 0; }
.fern-mark path { fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.brand-text { display: flex; flex-direction: column; gap: 2px; }
.brand-title { font-family: var(--font-display); font-weight: 600; font-size: 24px; letter-spacing: 0.2px; line-height: 1; white-space: nowrap; }
.brand-tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: rgba(255,255,255,0.62); text-transform: uppercase; }

.masthead-right { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.nz-clock { font-family: var(--font-mono); font-size: 12px; color: rgba(255,255,255,0.7); letter-spacing: 0.03em; white-space: nowrap; }

.owner-area { display: flex; align-items: center; gap: 10px; }
.owner-badge { display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 12px; color: var(--white); background: rgba(255,255,255,0.08); border: 1px solid var(--line-navy); padding: 6px 10px; border-radius: 100px; }
.owner-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--kowhai); flex-shrink: 0; }
.link-btn { background: none; border: none; color: rgba(255,255,255,0.75); font-size: 13px; text-decoration: underline; text-underline-offset: 2px; padding: 4px 2px; }
.link-btn:hover { color: var(--white); }

.btn { border-radius: 100px; border: 1px solid transparent; padding: 9px 18px; font-size: 14px; font-weight: 600; transition: all .18s ease; }
.btn-sm { padding: 6px 13px; font-size: 13px; }
.btn-primary { background: var(--jade); color: var(--white); }
.btn-primary:hover { background: var(--jade-dark); }
.btn-outline-invert { background: transparent; color: var(--white); border-color: var(--line-navy); }
.btn-outline-invert:hover { background: rgba(255,255,255,0.1); }
.btn-secondary { background: var(--paper-dim); color: var(--ink); }
.btn-secondary:hover { background: #dfdbcf; }
.btn-danger-outline { background: transparent; color: var(--danger); border-color: rgba(179,67,45,0.4); }
.btn-danger-outline:hover { background: rgba(179,67,45,0.08); }
.btn-text { background: none; border: none; padding: 8px 4px; font-weight: 600; color: var(--jade); font-size: 14px; }
